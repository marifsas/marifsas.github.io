<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Background -->
  <defs>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b8e994;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#50c878;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad5)" />
  
  <!-- Product mockup -->
  <g filter="drop-shadow(0 10px 30px rgba(0,0,0,0.2))">
    <!-- Product box -->
    <rect x="120" y="100" width="350" height="400" fill="#e8e8e8" rx="4" />
    <polygon points="120,100 200,60 550,60 470,100" fill="#f5f5f5" />
    <rect x="150" y="150" width="280" height="280" fill="#ecf0f1" rx="2" />
    <circle cx="290" cy="290" r="80" fill="#3498db" opacity="0.6" />
    <text x="290" y="305" font-size="24" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="bold">PRODUCT</text>
  </g>
  
  <!-- Studio lighting setup -->
  <circle cx="600" cy="200" r="30" fill="#f39c12" opacity="0.7" />
  <text x="600" y="215" font-size="12" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="bold">Key Light</text>
  
  <circle cx="800" cy="150" r="25" fill="#e74c3c" opacity="0.6" />
  <text x="800" y="160" font-size="11" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="bold">Fill</text>
  
  <circle cx="750" cy="320" r="20" fill="#95a5a6" opacity="0.5" />
  <text x="750" y="325" font-size="10" text-anchor="middle" fill="#fff" font-family="Arial">Reflector</text>
  
  <!-- Product showcase grid -->
  <g>
    <rect x="550" y="350" width="120" height="140" fill="#fff" rx="4" filter="drop-shadow(0 5px 15px rgba(0,0,0,0.1))" />
    <circle cx="610" cy="395" r="35" fill="#3498db" opacity="0.4" />
    <text x="610" y="450" font-size="12" text-anchor="middle" fill="#555" font-family="Arial">Front View</text>
    
    <rect x="700" y="350" width="120" height="140" fill="#fff" rx="4" filter="drop-shadow(0 5px 15px rgba(0,0,0,0.1))" />
    <rect x="725" y="375" width="70" height="70" fill="#2ecc71" opacity="0.4" />
    <text x="760" y="450" font-size="12" text-anchor="middle" fill="#555" font-family="Arial">Side View</text>
  </g>
  
  <text x="600" y="680" font-size="32" font-weight="bold" fill="#fff" font-family="Arial">Product & Editorial Photography</text>
  <text x="600" y="730" font-size="18" fill="#fff" font-family="Arial" opacity="0.95">Professional photography with lighting setup</text>
</svg>