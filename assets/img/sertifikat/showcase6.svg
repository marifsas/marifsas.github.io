<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Background -->
  <defs>
    <linearGradient id="grad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8c0c8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9999;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad6)" />
  
  <!-- Box mockup - Front -->
  <g filter="drop-shadow(0 10px 30px rgba(0,0,0,0.25))">
    <rect x="120" y="100" width="320" height="400" fill="#fff" rx="4" />
    <rect x="140" y="120" width="280" height="360" fill="#e74c3c" rx="2" />
    <text x="280" y="220" font-size="48" font-weight="bold" text-anchor="middle" fill="#fff" font-family="Arial">PACK</text>
    <text x="280" y="280" font-size="28" text-anchor="middle" fill="#fff" font-family="Arial">Premium</text>
    <circle cx="280" cy="350" r="20" fill="#fff" opacity="0.7" />
  </g>
  
  <!-- Box mockup - Side view -->
  <g filter="drop-shadow(0 8px 20px rgba(0,0,0,0.2))" opacity="0.8">
    <polygon points="440,220 480,190 480,550 440,580" fill="#d63031" />
    <polygon points="440,220 440,580 420,600 420,240" fill="#c23030" />
  </g>
  
  <!-- Print specifications -->
  <g>
    <text x="650" y="150" font-size="18" font-weight="bold" fill="#2c3e50" font-family="Arial">Print Specifications:</text>
    <rect x="650" y="170" width="250" height="30" fill="#fff" rx="4" />
    <text x="665" y="195" font-size="14" fill="#555" font-family="Arial">• Size: 210 x 297 mm</text>
    
    <rect x="650" y="220" width="250" height="30" fill="#fff" rx="4" />
    <text x="665" y="245" font-size="14" fill="#555" font-family="Arial">• Material: Premium Paper</text>
    
    <rect x="650" y="270" width="250" height="30" fill="#fff" rx="4" />
    <text x="665" y="295" font-size="14" fill="#555" font-family="Arial">• Finish: Glossy/Matte</text>
  </g>
  
  <!-- Dieline mockup -->
  <g opacity="0.6">
    <rect x="650" y="380" width="250" height="180" fill="#ecf0f1" rx="4" />
    <text x="775" y="405" font-size="14" font-weight="bold" text-anchor="middle" fill="#555" font-family="Arial">Dieline Template</text>
    <line x1="670" y1="430" x2="880" y2="430" stroke="#95a5a6" stroke-width="1" stroke-dasharray="5,5" />
    <line x1="670" y1="465" x2="880" y2="465" stroke="#95a5a6" stroke-width="1" stroke-dasharray="5,5" />
    <text x="775" y="525" font-size="12" text-anchor="middle" fill="#7f8c8d" font-family="Arial">Ready for production</text>
  </g>
  
  <text x="600" y="680" font-size="32" font-weight="bold" fill="#2c3e50" font-family="Arial">Packaging & Print Design</text>
  <text x="600" y="730" font-size="18" fill="#555" font-family="Arial">Complete packaging solutions with print-ready files</text>
</svg>