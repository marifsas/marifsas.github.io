<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Background -->
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd3a5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fd6585;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad4)" />
  
  <!-- Video frame mockup -->
  <rect x="100" y="80" width="480" height="640" fill="#000" rx="8" filter="drop-shadow(0 10px 30px rgba(0,0,0,0.3))" />
  <rect x="120" y="100" width="440" height="600" fill="#1a1a1a" />
  
  <!-- Play button -->
  <circle cx="340" cy="400" r="50" fill="#e74c3c" opacity="0.9" />
  <polygon points="330,375 330,425 370,400" fill="#fff" />
  
  <!-- Timeline -->
  <rect x="120" y="680" width="440" height="8" fill="#555" rx="4" />
  <circle cx="220" cy="684" r="6" fill="#e74c3c" />
  
  <!-- Motion graphics elements -->
  <rect x="700" y="150" width="100" height="100" fill="#2ecc71" rx="8" />
  <text x="750" y="210" font-size="14" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="bold">MOTION</text>
  
  <rect x="850" y="150" width="100" height="100" fill="#3498db" rx="8" />
  <text x="900" y="210" font-size="14" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="bold">GRAPHICS</text>
  
  <!-- Keyframes representation -->
  <circle cx="700" cy="320" r="8" fill="#e74c3c" />
  <line x1="715" y1="320" x2="845" y2="320" stroke="#95a5a6" stroke-width="2" />
  <circle cx="990" cy="320" r="8" fill="#2ecc71" />
  
  <text x="700" y="400" font-size="16" fill="#555" font-family="Arial">Frame 1</text>
  <text x="850" y="400" font-size="16" fill="#555" font-family="Arial">Frame 2</text>
  
  <!-- Waveform representation -->
  <polyline points="700,480 720,470 740,490 760,460 780,510 800,475 820,495 840,465" fill="none" stroke="#2c3e50" stroke-width="2" />
  
  <text x="600" y="680" font-size="32" font-weight="bold" fill="#fff" font-family="Arial">Motion Graphics & Short Video</text>
  <text x="600" y="730" font-size="18" fill="#fff" font-family="Arial" opacity="0.9">Professional video editing and animation</text>
</svg>