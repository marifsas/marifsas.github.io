<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Background -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f6d365;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fda085;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" />
  
  <!-- Poster mockup -->
  <rect x="100" y="80" width="400" height="640" fill="#fff" rx="8" filter="drop-shadow(0 10px 30px rgba(0,0,0,0.2))" />
  <rect x="120" y="100" width="360" height="200" fill="#e74c3c" />
  <text x="300" y="220" font-size="42" font-weight="bold" text-anchor="middle" fill="#fff" font-family="Arial">CAMPAIGN</text>
  <text x="300" y="270" font-size="28" text-anchor="middle" fill="#2c3e50" font-family="Arial">Poster Design</text>
  <circle cx="180" cy="400" r="40" fill="#3498db" opacity="0.8" />
  <circle cx="420" cy="480" r="35" fill="#2ecc71" opacity="0.8" />
  <text x="300" y="550" font-size="16" text-anchor="middle" fill="#7f8c8d" font-family="Arial">Professional poster layout</text>
  <text x="300" y="580" font-size="16" text-anchor="middle" fill="#7f8c8d" font-family="Arial">with visual hierarchy</text>
  
  <!-- Design elements -->
  <rect x="650" y="150" width="120" height="120" fill="#3498db" rx="8" />
  <rect x="820" y="150" width="120" height="120" fill="#2ecc71" rx="8" />
  <rect x="650" y="320" width="290" height="80" fill="#e74c3c" rx="8" opacity="0.7" />
  <text x="795" y="365" font-size="18" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="bold">Modern Design</text>
  
  <text x="600" y="520" font-size="32" font-weight="bold" fill="#2c3e50" font-family="Arial">Campaign & Poster Design</text>
  <text x="600" y="560" font-size="18" fill="#555" font-family="Arial">Professional marketing materials</text>
  <text x="600" y="590" font-size="18" fill="#555" font-family="Arial">with contemporary aesthetics</text>
</svg>