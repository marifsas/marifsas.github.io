<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Background -->
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cfd9df;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2ebf0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad3)" />
  
  <!-- Mobile wireframe -->
  <rect x="100" y="80" width="250" height="640" fill="#fff" rx="20" filter="drop-shadow(0 10px 30px rgba(0,0,0,0.15))" />
  <rect x="110" y="90" width="230" height="620" fill="#f8f9fa" rx="16" />
  
  <!-- Wireframe elements -->
  <rect x="125" y="110" width="200" height="50" fill="#3498db" rx="4" />
  <rect x="125" y="175" width="200" height="30" fill="#ecf0f1" rx="3" />
  <rect x="125" y="220" width="200" height="60" fill="#ecf0f1" rx="4" />
  <rect x="125" y="300" width="200" height="120" fill="#e74c3c" opacity="0.3" rx="4" />
  <rect x="125" y="440" width="90" height="40" fill="#2ecc71" rx="4" />
  <rect x="235" y="440" width="90" height="40" fill="#95a5a6" rx="4" />
  
  <!-- Desktop mockup -->
  <rect x="500" y="150" width="600" height="450" fill="#fff" rx="8" filter="drop-shadow(0 10px 30px rgba(0,0,0,0.15))" />
  <rect x="520" y="170" width="560" height="50" fill="#2c3e50" rx="4" />
  <rect x="520" y="240" width="120" height="120" fill="#3498db" opacity="0.6" rx="4" />
  <rect x="680" y="240" width="400" height="120" fill="#ecf0f1" rx="4" />
  <rect x="520" y="380" width="560" height="60" fill="#e74c3c" opacity="0.3" rx="4" />
  
  <text x="600" y="670" font-size="32" font-weight="bold" fill="#2c3e50" font-family="Arial">UI/UX — Aplikasi & Landing Page</text>
  <text x="600" y="720" font-size="18" fill="#555" font-family="Arial">Responsive design with wireframes and prototypes</text>
</svg>