<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Background -->
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a1c4fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c2e9fb;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad2)" />
  
  <!-- Logo variations -->
  <g>
    <!-- Logo 1 -->
    <circle cx="200" cy="200" r="70" fill="#e74c3c" />
    <text x="200" y="220" font-size="80" font-weight="bold" text-anchor="middle" fill="#fff" font-family="Arial">A</text>
    
    <!-- Logo 2 - Color variation -->
    <circle cx="520" cy="200" r="70" fill="#3498db" />
    <text x="520" y="220" font-size="80" font-weight="bold" text-anchor="middle" fill="#fff" font-family="Arial">A</text>
  </g>
  
  <!-- Brand guidelines -->
  <text x="100" y="340" font-size="20" font-weight="bold" fill="#2c3e50" font-family="Arial">Color Palette:</text>
  <rect x="100" y="360" width="50" height="50" fill="#e74c3c" />
  <rect x="170" y="360" width="50" height="50" fill="#3498db" />
  <rect x="240" y="360" width="50" height="50" fill="#2ecc71" />
  <rect x="310" y="360" width="50" height="50" fill="#f39c12" />
  
  <!-- Mockup brand items -->
  <rect x="550" y="300" width="280" height="200" fill="#fff" rx="8" filter="drop-shadow(0 5px 15px rgba(0,0,0,0.1))" />
  <text x="690" y="330" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50" font-family="Arial">Business Card</text>
  <rect x="570" y="350" width="240" height="120" fill="#ecf0f1" rx="4" />
  <circle cx="590" cy="370" r="15" fill="#e74c3c" />
  <text x="620" y="375" font-size="14" fill="#555" font-family="Arial">Company Name</text>
  
  <text x="600" y="640" font-size="36" font-weight="bold" fill="#2c3e50" font-family="Arial">Branding & Visual Identity</text>
  <text x="600" y="690" font-size="18" fill="#555" font-family="Arial">Complete brand identity system with guidelines</text>
</svg>